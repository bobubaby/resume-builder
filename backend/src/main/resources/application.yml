server:
  port: 8080

spring:
  application:
    name: resume-builder
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume_builder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 默认 root/123456，可用环境变量 DB_USERNAME / DB_PASSWORD 覆盖
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.resume.mapper: debug
